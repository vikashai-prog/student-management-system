<!DOCTYPE html>
<html>
<head>
    <title>Student Management</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
        }

        .dark-mode {
            background: #121212;
            color: white;
        }

        .card {
            border-radius: 12px;
        }
    </style>
</head>

<body id="body">

<!-- 🔥 NAVBAR -->
<nav class="navbar navbar-dark bg-dark shadow">
    <div class="container">
        <span class="navbar-brand">🎓 Student System</span>

        <button onclick="toggleDark()" class="btn btn-light btn-sm">
            🌙 Dark Mode
        </button>
    </div>
</nav>

<div class="container mt-4">

    <!-- 🔍 SEARCH + COUNT -->
    <div class="d-flex justify-content-between mb-3">
        <input type="text" id="search" placeholder="🔍 Search student..."
               class="form-control w-50" onkeyup="searchStudent()">

        <h5>Total: {{ students|length }}</h5>
    </div>

    <!-- ➕ ADD -->
    <a href="/add" class="btn btn-primary mb-3">
        <i class="bi bi-person-plus"></i> Add Student
    </a>

    <!-- 📊 TABLE -->
    <div class="card shadow p-3">
        <table class="table table-hover" id="studentTable">

            <thead class="table-dark">
                <tr>
                    <th>Roll</th>
                    <th>Name</th>
                    <th>Age</th>
                    <th class="text-center">Action</th>
                </tr>
            </thead>

            <tbody>
                {% for s in students %}
                <tr>
                    <td>{{ s[0] }}</td>
                    <td>{{ s[1] }}</td>
                    <td>{{ s[2] }}</td>
                    <td class="text-center">
                        <a href="/edit/{{ s[0] }}" class="btn btn-warning btn-sm">
                            <i class="bi bi-pencil"></i>
                        </a>

                        <a href="/delete/{{ s[0] }}" class="btn btn-danger btn-sm">
                            <i class="bi bi-trash"></i>
                        </a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>

        </table>
    </div>

</div>

<!-- 🤖 CHATBOT UI -->
<div style="position: fixed; bottom: 20px; right: 20px; width: 300px;">
    <div class="card shadow">
        <div class="card-header bg-dark text-white">AI Chatbot</div>

        <div id="chatBox" style="height:200px; overflow-y:auto; padding:10px;"></div>

        <div class="d-flex">
            <input id="msg" class="form-control" placeholder="Ask something...">
            <button onclick="sendMsg()" class="btn btn-primary">Send</button>
        </div>
    </div>
</div>

<!-- 🔥 JAVASCRIPT -->
<script>
    function searchStudent() {
        let input = document.getElementById("search").value.toLowerCase();
        let rows = document.querySelectorAll("#studentTable tbody tr");

        rows.forEach(row => {
            let text = row.innerText.toLowerCase();
            row.style.display = text.includes(input) ? "" : "none";
        });
    }

    function toggleDark() {
        document.getElementById("body").classList.toggle("dark-mode");
    }

    function sendMsg() {
        let msg = document.getElementById("msg").value;

        fetch("/chat", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({message: msg})
        })
        .then(res => res.json())
        .then(data => {
            let box = document.getElementById("chatBox");
            box.innerHTML += "<div><b>You:</b> " + msg + "</div>";
            box.innerHTML += "<div><b>Bot:</b> " + data.reply + "</div>";
        });

        document.getElementById("msg").value = "";
    }
</script>

</body>
</html>
